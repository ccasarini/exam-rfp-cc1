<!DOCTYPE html>
<html>
<head>
    <title>Haiti Department Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Leaflet CSS (The 'makeup' or styling for the map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 2. Leaflet JavaScript (The 'brains' of the map) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 3. Make the map fill the entire browser window */
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        /* Style for the info box */
        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- 4. The container where the map will appear -->
    <div id="map"></div>

    <script>
        // 5. Create the map and center it on Haiti
        // [18.9, -72.3] are the coordinates, and 8 is the zoom level
        var map = L.map('map').setView([18.9712, -72.2852], 8);

        // 6. Add a "Base Map" (The background images)
        // We are using OpenStreetMap, which is free and open-source
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 7. Load the Haiti Landmass (Admin 0)
        fetch('haiti_borders/hti_admin0.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: "none",      // No border
                        fillColor: "#d1d1d1", // Light grey landmass
                        fillOpacity: 0.8
                    }
                }).addTo(map);
            });

        // 8. Load the Administrative Lines (to show ONLY the land border)
        fetch('haiti_borders/hti_adminlines.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    filter: function(feature) {
                        // Only show the international land border (adm_level 0)
                        // This effectively "deletes" the sea borders (adm_level 99)
                        return feature.properties.adm_level === 0;
                    },
                    style: {
                        color: "#333", // Dark line for the land border
                        weight: 3
                    }
                }).addTo(map);
            })
            .catch(function(error) {
                console.log("Error loading the JSON file: " + error);
            });
    </script>
</body>
</html>
