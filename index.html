<!DOCTYPE html>
<html>
<head>
    <title>Haiti Department Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Leaflet CSS (The 'makeup' or styling for the map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 2. Leaflet JavaScript (The 'brains' of the map) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 3. Make the map fill the entire browser window */
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        /* 4. Style the interactive button */
        #project-button {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000; /* Ensures button stays above the map */
            padding: 12px 24px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        #project-button:hover {
            background-color: #f0f0f0;
            border-color: #999;
        }
    </style>
</head>
<body>

    <!-- 5. Add the Button and the Map container -->
    <button id="project-button">click here to see the project</button>
    <div id="map"></div>

    <script>
        // 5. Create the map and set a starting view near Haiti immediately
        var map = L.map('map').setView([18.9, -72.3], 7);
        
        // --- STEP 1: Create a custom pane for labels ---
        // This ensures writings (text) always float above the colored polygons
        map.createPane('labels');
        map.getPane('labels').style.zIndex = 650;
        map.getPane('labels').style.pointerEvents = 'none';

        var currentLayer;
        var landBordersLayer;
        var isFirstLoad = true;

        // --- STEP 2: Refine Styles ---
        var haitiStyle = {
            color: "#999",
            weight: 0.5,
            fillColor: "#e8f5e9", // Pastel Green
            fillOpacity: 0.8
        };

        // --- STEP 3: Add Base Layers ---
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Labels layer in the foreground pane
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 20,
            pane: 'labels'
        }).addTo(map);

        // 8. Function to show Haiti (Clean and Pastel)
        function showHaiti() {
            if (currentLayer) map.removeLayer(currentLayer);
            if (landBordersLayer) map.removeLayer(landBordersLayer);
            
            fetch('haiti_borders/boundaries/hti_admin0.geojson')
                .then(res => res.json())
                .then(data => {
                    currentLayer = L.geoJSON(data, { style: haitiStyle }).addTo(map);
                    
                    if (isFirstLoad) {
                        map.fitBounds(currentLayer.getBounds(), { padding: [20, 20] });
                        isFirstLoad = false;
                    } else {
                        map.flyToBounds(currentLayer.getBounds(), { padding: [50, 50], duration: 2, easeLinearity: 0.25 });
                    }
                });
            
            document.getElementById('project-button').innerHTML = "click here to see the project";
        }

        // 9. Function to show Port-au-Prince (Land-only Dark Grey Profile)
        function showProject() {
            if (currentLayer) map.removeLayer(currentLayer);
            if (landBordersLayer) map.removeLayer(landBordersLayer);

            const loadPaup = fetch('haiti_borders/boundaries/port_au_prince.geojson').then(r => r.json());
            const loadLines = fetch('haiti_borders/boundaries/hti_adminlines.geojson').then(r => r.json());

            Promise.all([loadPaup, loadLines]).then(([paupData, linesData]) => {
                // Set for fast coordinate comparison
                const papCoords = new Set();
                paupData.features[0].geometry.coordinates[0].forEach(c => {
                    papCoords.add(c[0].toFixed(5) + "," + c[1].toFixed(5));
                });

                // City area remains transparent (just a container)
                currentLayer = L.geoJSON(paupData, { 
                    style: { color: "transparent", fillColor: "transparent" } 
                }).addTo(map);

                // Filter for land borders only (adm_level 2) that touch Port-au-Prince
                landBordersLayer = L.geoJSON(linesData, {
                    filter: function(feature) {
                        if (feature.properties.adm_level !== 2) return false;
                        const firstPoint = feature.geometry.coordinates[0];
                        return papCoords.has(firstPoint[0].toFixed(5) + "," + firstPoint[1].toFixed(5));
                    },
                    style: {
                        color: "#333", // Dark Grey
                        weight: 2,
                        opacity: 1
                    }
                }).addTo(map);

                // Precision Zoom to City Center
                map.flyToBounds(currentLayer.getBounds(), { 
                    padding: [40, 40], // Tighter zoom for precision
                    duration: 2,
                    easeLinearity: 0.25
                });
            });
            
            document.getElementById('project-button').innerHTML = "back to national map";
        }

        // 10. Button Logic: Toggle between views
        document.getElementById('project-button').onclick = function() {
            if (this.innerHTML === "click here to see the project") {
                showProject();
            } else {
                showHaiti();
            }
        };

        // Start with Haiti view
        showHaiti();
    </script>
</body>
</html>
