<!DOCTYPE html>
<html>
<head>
    <title>Haiti Department Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Leaflet CSS (The 'makeup' or styling for the map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 2. Leaflet JavaScript (The 'brains' of the map) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 3. Make the map fill the entire browser window */
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        /* Style for the info box */
        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- 4. The container where the map will appear -->
    <div id="map"></div>

    <script>
        // 5. Create the map and center it on Haiti
        // [18.9, -72.3] are the coordinates, and 8 is the zoom level
        var map = L.map('map').setView([18.9712, -72.2852], 8);

        // 6. Add a "Base Map" (Minimalist style without built-in borders)
        // We use CartoDB Positron which is much cleaner for data visualization
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 7. Load the Haiti National Border (Admin 0)
        // This includes the full coastline and the land border with the DR
        fetch('haiti_borders/hti_admin0.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: "#333",      // Dark grey border for the whole country
                        weight: 2,          // Medium thickness
                        fillColor: "#d1d1d1", // Light grey landmass
                        fillOpacity: 0.6
                    }
                }).addTo(map);
            })
            .catch(function(error) {
                console.log("Error loading the JSON file: " + error);
            });
    </script>
</body>
</html>
