<!DOCTYPE html>
<html>
<head>
    <title>Haiti Department Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Leaflet CSS (The 'makeup' or styling for the map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 2. Leaflet JavaScript (The 'brains' of the map) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 3. Make the map fill the entire browser window */
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        /* 4. Style the interactive button */
        #project-button {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000; /* Ensures button stays above the map */
            padding: 12px 24px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        #project-button:hover {
            background-color: #f0f0f0;
            border-color: #999;
        }
    </style>
</head>
<body>

    <!-- 5. Add the Button and the Map container -->
    <button id="project-button">click here to see the project</button>
    <div id="map"></div>

    <script>
        // 5. Create the map and set a starting view near Haiti immediately
        var map = L.map('map').setView([18.9, -72.3], 7);
        
        // --- STEP 1: Create a custom pane for labels ---
        // This ensures writings (text) always float above the colored polygons
        map.createPane('labels');
        map.getPane('labels').style.zIndex = 650;
        map.getPane('labels').style.pointerEvents = 'none'; // Allow clicks to pass through text

        var currentLayer;
        var isFirstLoad = true;

        // --- STEP 2: Refine Styles ---
        // Pastel green for Haiti, clear dark grey for city center
        var haitiStyle = {
            color: "#999",
            weight: 0.5,
            fillColor: "#e8f5e9", // Lighter Pastel Green
            fillOpacity: 0.8
        };

        var paupStyle = {
            color: "#333", // Dark Grey profile as requested
            weight: 2,
            fillColor: "transparent", // Simple profile, no internal blue/fill
            fillOpacity: 0
        };

        // --- STEP 3: Add Base Layers ---
        // Base map without labels
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Labels layer in the foreground pane
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 20,
            pane: 'labels' // Forces labels to be on top of polygons
        }).addTo(map);

        // 8. Function to show Haiti (Clean and Pastel)
        function showHaiti() {
            if (currentLayer) map.removeLayer(currentLayer);
            
            fetch('haiti_borders/geojson/hti_admin0.geojson')
                .then(res => res.json())
                .then(data => {
                    currentLayer = L.geoJSON(data, { style: haitiStyle }).addTo(map);
                    
                    const zoomOptions = { padding: [50, 50], duration: 2, easeLinearity: 0.25 };
                    if (isFirstLoad) {
                        map.fitBounds(currentLayer.getBounds(), { padding: [20, 20] });
                        isFirstLoad = false;
                    } else {
                        map.flyToBounds(currentLayer.getBounds(), zoomOptions);
                    }
                });
            
            document.getElementById('project-button').innerHTML = "click here to see the project";
        }

        // 9. Function to show Port-au-Prince (Simple Dark Grey Profile)
        function showProject() {
            if (currentLayer) map.removeLayer(currentLayer);
            
            // Only load the city center boundary, no more internal neighborhood lines
            fetch('haiti_borders/geojson/port_au_prince.geojson')
                .then(res => res.json())
                .then(data => {
                    currentLayer = L.geoJSON(data, { style: paupStyle }).addTo(map);

                    map.flyToBounds(currentLayer.getBounds(), { 
                        padding: [120, 120], 
                        duration: 2,
                        easeLinearity: 0.25
                    });
                });
            
            document.getElementById('project-button').innerHTML = "back to national map";
        }

        // 10. Button Logic: Toggle between views
        document.getElementById('project-button').onclick = function() {
            if (this.innerHTML === "click here to see the project") {
                showProject();
            } else {
                showHaiti();
            }
        };

        // Start with Haiti view
        showHaiti();
    </script>
</body>
</html>
