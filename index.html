<!DOCTYPE html>
<html>
<head>
    <title>Haiti Department Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Leaflet CSS (The 'makeup' or styling for the map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 2. Leaflet JavaScript (The 'brains' of the map) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 3. Make the map fill the entire browser window */
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        /* 4. Style the interactive button */
        #project-button {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000; /* Ensures button stays above the map */
            padding: 12px 24px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        #project-button:hover {
            background-color: #f0f0f0;
            border-color: #999;
        }
    </style>
</head>
<body>

    <!-- 5. Add the Button and the Map container -->
    <button id="project-button">click here to see the project</button>
    <div id="map"></div>

    <script>
        // 5. Create the map and set a starting view near Haiti immediately
        // This prevents the map from looking "lost" while data is loading
        var map = L.map('map').setView([18.9, -72.3], 7);
        var currentLayer;
        var isFirstLoad = true; // Flag to handle the very first zoom differently

        // 6. Define Pale/Neutral Styles
        var haitiStyle = {
            color: "#888",
            weight: 1,
            fillColor: "#e8f5e9", // Lighter Pastel Green
            fillOpacity: 0.6
        };

        var paupStyle = {
            color: "transparent", // No stroke for the main polygon
            weight: 0,
            fillColor: "#4a90e2",
            fillOpacity: 0.4
        };

        var landBorderStyle = {
            color: "#4a90e2",
            weight: 2.5,
            opacity: 0.8,
            lineJoin: "round"
        };

        // 7. Base Layers
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Labels layer on top - Voyager labels are clearer/darker
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 20,
            zIndex: 1000,
            opacity: 0.9
        }).addTo(map);

        var landBordersLayer;

        // 8. Function to show Haiti
        function showHaiti() {
            if (currentLayer) map.removeLayer(currentLayer);
            if (landBordersLayer) map.removeLayer(landBordersLayer);
            
            fetch('haiti_borders/geojson/hti_admin0.geojson')
                .then(res => res.json())
                .then(data => {
                    currentLayer = L.geoJSON(data, { style: haitiStyle }).addTo(map);
                    
                    const zoomOptions = { padding: [50, 50], duration: 2, easeLinearity: 0.25 };
                    if (isFirstLoad) {
                        map.fitBounds(currentLayer.getBounds(), { padding: [20, 20] });
                        isFirstLoad = false;
                    } else {
                        map.flyToBounds(currentLayer.getBounds(), zoomOptions);
                    }
                });
            
            document.getElementById('project-button').innerHTML = "click here to see the project";
        }

        // 9. Function to show Port-au-Prince
        function showProject() {
            if (currentLayer) map.removeLayer(currentLayer);
            
            const loadPaup = fetch('haiti_borders/geojson/port_au_prince.geojson').then(r => r.json());
            const loadLines = fetch('haiti_borders/geojson/hti_adminlines.geojson').then(r => r.json());

            Promise.all([loadPaup, loadLines]).then(([paupData, linesData]) => {
                if (landBordersLayer) map.removeLayer(landBordersLayer);

                currentLayer = L.geoJSON(paupData, { style: paupStyle }).addTo(map);

                // Highlight land borders (adm_level 2 are internal commune boundaries)
                // This elegantly excludes the coastline (adm_level 99)
                landBordersLayer = L.geoJSON(linesData, {
                    filter: function(feature) {
                        return feature.properties.adm_level === 2;
                    },
                    style: landBorderStyle
                }).addTo(map);

                map.flyToBounds(currentLayer.getBounds(), { 
                    padding: [100, 100], 
                    duration: 2,
                    easeLinearity: 0.25
                });
            });
            
            document.getElementById('project-button').innerHTML = "back to national map";
        }

        // 10. Button Logic: Toggle between views
        document.getElementById('project-button').onclick = function() {
            if (this.innerHTML === "click here to see the project") {
                showProject();
            } else {
                showHaiti();
            }
        };

        // Start with Haiti view
        showHaiti();
    </script>
</body>
</html>
