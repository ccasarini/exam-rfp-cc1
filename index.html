<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haiti Border - Simple Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: white; }
        #map { width: 100%; height: 100vh; background: white; }
        .leaflet-control-attribution { display: none; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Create the map without background images or controls
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        });

        // Load the GeoJSON file (the ordered geometry)
        fetch('haiti_borders.json')
            .then(response => response.json())
            .then(data => {
                // Add the border to the map
                var border = L.geoJSON(data, {
                    style: {
                        color: 'black',
                        weight: 2,
                        fillOpacity: 0
                    }
                }).addTo(map);

                // Zoom the map to fit the border
                map.fitBounds(border.getBounds());
            })
            .catch(error => console.error('Error loading the map data:', error));
    </script>
</body>
</html>
