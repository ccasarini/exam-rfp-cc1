<!DOCTYPE html>
<html>
<head>
    <title>Haiti Department Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Leaflet CSS (The 'makeup' or styling for the map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 2. Leaflet JavaScript (The 'brains' of the map) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 3. Make the map fill the entire browser window */
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        /* 4. Style the interactive button */
        #project-button {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000; /* Ensures button stays above the map */
            padding: 12px 24px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        #project-button:hover {
            background-color: #f0f0f0;
            border-color: #999;
        }
    </style>
</head>
<body>

    <!-- 5. Add the Button and the Map container -->
    <button id="project-button">click here to see the project</button>
    <div id="map"></div>

    <script>
        var map = L.map('map');
        var currentLayer; // We use this to keep track of which shape is on the map

        // 6. Define Pale/Neutral Styles
        var haitiStyle = {
            color: "#666",        // Neutral grey border
            weight: 1.5,
            fillColor: "#d1d1d1", // Pale grey
            fillOpacity: 0.4
        };

        var paupStyle = {
            color: "#4a90e2",     // Soft blue border
            weight: 3,
            fillColor: "#aec6cf", // Pale blue
            fillOpacity: 0.5
        };

        // 7. Base Layers (Ground and Labels)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 8. Function to show Haiti (The initial view)
        function showHaiti() {
            if (currentLayer) map.removeLayer(currentLayer);
            
            fetch('haiti_borders/hti_admin0.geojson')
                .then(res => res.json())
                .then(data => {
                    currentLayer = L.geoJSON(data, { style: haitiStyle }).addTo(map);
                    map.fitBounds(currentLayer.getBounds(), { padding: [20, 20] });
                });
            
            document.getElementById('project-button').innerHTML = "click here to see the project";
        }

        // 9. Function to show Port-au-Prince (The project view)
        function showProject() {
            if (currentLayer) map.removeLayer(currentLayer);
            
            fetch('haiti_borders/port_au_prince.geojson')
                .then(res => res.json())
                .then(data => {
                    currentLayer = L.geoJSON(data, { style: paupStyle }).addTo(map);
                    map.fitBounds(currentLayer.getBounds(), { padding: [80, 80] });
                });
            
            document.getElementById('project-button').innerHTML = "back to national map";
        }

        // 10. Button Logic: Toggle between views
        document.getElementById('project-button').onclick = function() {
            if (this.innerHTML === "click here to see the project") {
                showProject();
            } else {
                showHaiti();
            }
        };

        // Start with Haiti view
        showHaiti();
    </script>
</body>
</html>
