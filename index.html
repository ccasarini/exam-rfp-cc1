<!DOCTYPE html>
<html>
<head>
    <title>Haiti Department Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Leaflet CSS (The 'makeup' or styling for the map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 2. Leaflet JavaScript (The 'brains' of the map) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 3. Make the map fill the entire browser window */
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        /* Style for the info box */
        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- 4. The container where the map will appear -->
    <div id="map"></div>

    <script>
        // 5. Create the map (Initial view will be set automatically later)
        var map = L.map('map');

        // 6a. Base Map Layer (The ground - No labels)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 7. Load the Port-au-Prince City Boundary
        fetch('haiti_borders/port_au_prince.geojson')
            .then(res => res.json())
            .then(data => {
                var cityLayer = L.geoJSON(data, {
                    style: {
                        color: "#e63946",   // Red border for the city
                        weight: 3,
                        fillColor: "#e63946", 
                        fillOpacity: 0.2
                    }
                }).addTo(map);

                // 8. AUTOMATIC ZOOM: Make the map fit Port-au-Prince perfectly
                map.fitBounds(cityLayer.getBounds(), {
                    padding: [50, 50] // Margin so the city isn't touching the edges
                });
            })
            .catch(err => console.log("Error: " + err));

        // 6b. Label Layer (The names - Stays on top of everything)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);
    </script>
</body>
</html>
