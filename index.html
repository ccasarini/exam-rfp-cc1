<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haiti Border Map</title>
    
    <!-- 1. Include Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        /* 2. Style the map to fill the whole screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- 3. The container for our map -->
    <div id="map"></div>

    <!-- 4. Include Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <script>
        // 5. Initialize the map
        // We set the view to Haiti's general coordinates (lat: 18.9, lng: -72.7) 
        // and a zoom level of 7.
        var map = L.map('map').setView([18.9, -72.7], 7);

        // 6. Add a "Base Layer" - This is the actual map image.
        // We use CartoDB Positron (No Labels) for a clean look without "bubbles" (POIs/Labels).
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        // 7. Load our GeoJSON file (the border we downloaded)
        fetch('haiti_border.geojson')
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                // Add the GeoJSON to the map with some styling
                var borderLayer = L.geoJSON(data, {
                    style: {
                        color: "#000000", // Black border
                        weight: 2,        // Thickness
                        opacity: 1.0,     // Solid line
                        fillOpacity: 0    // No fill (removes the "bubble" effect)
                    }
                }).addTo(map);

                // 8. Automatically zoom the map to fit the border perfectly
                map.fitBounds(borderLayer.getBounds());
            })
            .catch(function(error) {
                console.error('Error loading GeoJSON:', error);
            });
    </script>
</body>
</html>
